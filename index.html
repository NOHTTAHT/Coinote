<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F8F6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B100D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coinote">
<title>Coinote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" rel="stylesheet">
<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F5F8F6; --card:#FFFFFF; --soft:#EDF2EF; --line:#E1E8E3; --ink:#16201A; --muted:#6A7A70;
  --accent:#187A50; --accent-ink:#FFFFFF; --accent-text:#187A50; --mint:#2F9A6A; --exp:#D24B3C; --inc:#1F8A5B; --warn:#D9932B;
  --hero:#0F3A28; --hero-ink:#F2FAF5; --hero-inc:#8FE3B6; --hero-exp:#FFAE9F;
  --shadow:0 1px 2px rgba(16,40,28,.05),0 4px 12px rgba(16,40,28,.05); --nav:rgba(255,255,255,.94);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0B100D; --card:#141B17; --soft:#1B241F; --line:#25302A; --ink:#E7F0EA; --muted:#8C9C92;
  --accent:#3FCB86; --accent-ink:#04140B; --accent-text:#4FD893; --mint:#4FD893; --exp:#FF7B6B; --inc:#4FD893; --warn:#E9A23B;
  --hero:#123A29; --hero-ink:#F2FAF5; --hero-inc:#8FE3B6; --hero-exp:#FFAE9F;
  --shadow:0 0 0 1px rgba(231,240,234,.05); --nav:rgba(20,27,23,.94);
}}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0B100D; --card:#141B17; --soft:#1B241F; --line:#25302A; --ink:#E7F0EA; --muted:#8C9C92;
  --accent:#3FCB86; --accent-ink:#04140B; --accent-text:#4FD893; --mint:#4FD893; --exp:#FF7B6B; --inc:#4FD893; --warn:#E9A23B;
  --hero:#123A29; --hero-ink:#F2FAF5; --hero-inc:#8FE3B6; --hero-exp:#FFAE9F;
  --shadow:0 0 0 1px rgba(231,240,234,.05); --nav:rgba(20,27,23,.94);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Mitr,system-ui,sans-serif;font-weight:300;font-size:15px}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[v-cloak]{display:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga'}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.b{font-weight:500}
.num{font-variant-numeric:tabular-nums}
.exp{color:var(--exp)} .inc{color:var(--inc)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.dot .ms{font-size:21px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--soft);font-size:11.5px;color:var(--muted)}
.chip.slip{background:color-mix(in srgb,var(--mint) 18%,transparent);color:var(--mint)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:#b77713}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--exp) 14%,transparent);color:var(--exp)}
.btn.block{width:100%}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 4px}
.input{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;outline:none}
textarea.input{height:auto;min-height:96px;padding:12px 14px;line-height:1.5}
.input:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:11px;color:var(--muted);font-weight:400}
.seg button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 2px 6px rgba(0,0,0,.06)}
h1{font-size:20px;font-weight:500;margin:0}
h2{font-size:15px;font-weight:500;margin:22px 4px 10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:9px}
.brand img{width:34px;height:34px;border-radius:11px}
.month{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.month b{font-weight:500;font-size:14px;min-width:112px;text-align:center}

/* summary */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:20px 20px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.hero .lbl{font-size:12.5px;opacity:.72}
.hero .exp{color:var(--hero-exp)} .hero .inc{color:var(--hero-inc)}
.hero .big{font-size:32px;font-weight:500;margin:0 0 16px;letter-spacing:-.01em}
.hero .pair{display:flex;gap:8px}
.hero .pair>div{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.hero .pair .tiny{opacity:.72}
.hero .pair .ms{font-size:16px;vertical-align:-3px}

/* list */
.day{margin-top:14px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 6px;font-size:12.5px;color:var(--muted)}
.dayhead b{color:var(--ink);font-weight:500;font-size:14px}
.txrow{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left}
.txrow+.txrow{border-top:1px solid var(--line)}
.txrow:active{background:var(--soft)}
.amt{font-weight:400;font-size:15.5px;white-space:nowrap}
.empty{text-align:center;padding:36px 10px;color:var(--muted)}
.empty .ms{font-size:46px;color:var(--line);display:block;margin-bottom:8px}

/* nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom) + 6px)}
nav.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0}
nav.bar button.on{color:var(--accent-text)}
nav.bar .plus{width:56px;height:56px;margin:-26px auto 0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
nav.bar .plus .ms{font-size:30px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(4,14,9,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.catgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 4px;margin-top:12px}
.drop .catgrid{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;margin-top:8px}
.opt.add{border-style:dashed;color:var(--muted)}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.catgrid button .dot{opacity:.55;transform:scale(.92);transition:.15s}
.catgrid button.on{color:var(--ink);font-weight:500}
.catgrid button.on .dot{opacity:1;transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5px currentColor}
.amountbox{background:var(--card);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.amountbox .val{flex:1;text-align:right;font-size:32px;font-weight:500;overflow:hidden;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.keys button{height:50px;border-radius:15px;background:var(--card);font-size:20px;font-weight:400;box-shadow:0 2px 6px rgba(16,40,28,.06)}
.keys button.op{background:var(--soft);color:var(--muted);font-size:24px}
.keys button.ok{background:var(--accent);color:var(--accent-ink);grid-row:span 2;height:auto;font-size:16px;font-weight:500}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:flex;align-items:center;gap:8px;min-height:46px;padding:8px 11px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);text-align:left;font-size:13.5px;min-width:0}
.opt .bul{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.opt.on .bul{border-color:var(--accent)}
.opt.on .bul:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.opt[disabled]{opacity:.35}
.drop .dropbtn{width:100%;min-height:48px}
.drop .dropbtn .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.drop.open .dropbtn{border-color:var(--accent)}
.drop.open .dropbtn .chev{transform:rotate(180deg)}
.drop .droplist{margin-top:8px;animation:fade .15s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.opt .ms{font-size:19px;flex:none}
.opt .sub{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{display:flex;justify-content:center;margin:10px 0 -2px}
.swap button{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent-text)}
.stat{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px}
.stat+.stat{border-top:1px dashed var(--line)}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13px}
.pill.on{border-color:var(--accent);color:var(--accent-text);font-weight:500}
.pill .ms{font-size:18px}

/* accounts, debts */
.acc{display:flex;align-items:center;gap:12px;padding:12px 2px;width:100%;text-align:left}
.acc+.acc{border-top:1px solid var(--line)}
.bar2{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar2>i{display:block;height:100%;border-radius:9px}
.cc{aspect-ratio:1.586;max-height:236px;border-radius:16px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;width:100%;text-align:left;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 24px rgba(4,14,9,.22)}
.cc .chipcc{width:38px;height:28px;border-radius:6px;margin-top:14px;background:linear-gradient(135deg,#EADBB0,#C8AE74);position:relative;box-shadow:inset 0 0 0 1px rgba(90,70,30,.25)}
.cc .chipcc:before{content:"";position:absolute;inset:8px 0;border-top:1px solid rgba(90,70,30,.3);border-bottom:1px solid rgba(90,70,30,.3)}
.cc .chipcc:after{content:"";position:absolute;inset:0 13px;border-left:1px solid rgba(90,70,30,.3);border-right:1px solid rgba(90,70,30,.3)}
.cc .ccno{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.12em;opacity:.9}
.cc .bar2{background:rgba(255,255,255,.25);height:6px} .cc .bar2>i{background:#fff}

/* report */
.legend{display:flex;align-items:center;gap:10px;padding:9px 2px}
.legend+.legend{border-top:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:10px}
.bars i{flex:1;background:color-mix(in srgb,var(--muted) 35%,transparent);border-radius:4px 4px 2px 2px;min-height:2px}
.bars i.top{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.bars i.today{background:var(--accent)}
.acno{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.04em}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;max-width:420px;margin:0 auto}
.login img{width:84px;height:84px;border-radius:24px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:12px;padding:10px 12px;word-break:break-all;user-select:all}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.iconpick button{height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.iconpick button.on{background:var(--accent);color:var(--accent-ink)}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 2px;width:100%;text-align:left}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .ms{color:var(--muted)}
</style>
</head>
<body>
<div id="app" v-cloak>

<!-- ───────── sign in ───────── -->
<div v-if="!ready" class="login"><p class="muted" style="text-align:center">กำลังโหลด…</p></div>
<div v-else-if="!signedIn" class="login">
  <div style="text-align:center">
    <img src="icon.svg" alt="">
    <h1 style="margin-top:16px;font-size:26px">Coinote</h1>
    <p class="muted" style="margin:6px 0 26px">จดรายรับรายจ่าย อ่านสลิปให้อัตโนมัติ</p>
  </div>
  <template v-if="hasCloud">
    <label class="field"><span>อีเมล</span><input class="input" v-model="login.email" type="email" autocomplete="username"></label>
    <label class="field"><span>รหัสผ่าน</span><input class="input" v-model="login.password" type="password" autocomplete="current-password" @keyup.enter="signIn"></label>
    <button class="btn block" style="margin-top:18px" @click="signIn" :disabled="busy">{{ busy ? 'กำลังเข้า…' : 'เข้าสู่ระบบ' }}</button>
    <p v-if="login.error" class="exp small" style="text-align:center">{{ login.error }}</p>
  </template>
  <p v-else class="muted small" style="text-align:center">ยังไม่ได้ตั้งค่า Supabase ใน config.js จึงเปิดได้แค่โหมดตัวอย่าง</p>
  <button class="btn ghost block" style="margin-top:10px" @click="startDemo">ลองใช้แบบตัวอย่าง (เก็บในเครื่องนี้)</button>
</div>

<template v-else>
<div class="wrap">

  <!-- ───────── home ───────── -->
  <template v-if="tab==='home'">
    <div class="top">
      <div class="brand"><img src="icon.svg" alt="Coinote"></div>
      <div class="month">
        <button @click="shiftMonth(-1)" aria-label="เดือนก่อน"><span class="ms">chevron_left</span></button>
        <b>{{ monthLabel }}</b>
        <button @click="shiftMonth(1)" aria-label="เดือนถัดไป"><span class="ms">chevron_right</span></button>
      </div>
      <button class="iconbtn" @click="tab='settings'" aria-label="ตั้งค่า"><span class="ms">settings</span></button>
    </div>

    <div class="hero">
      <div class="lbl">คงเหลือเดือนนี้</div>
      <div class="big num" :class="monthIncome - monthExpense < 0 ? 'exp' : ''">{{ money(monthIncome - monthExpense, true) }}</div>
      <div class="pair">
        <div><div class="tiny"><span class="ms">south_west</span> รายรับ</div><div class="num inc">{{ money(monthIncome) }}</div></div>
        <div><div class="tiny"><span class="ms">north_east</span> รายจ่าย</div><div class="num exp">{{ money(monthExpense) }}</div></div>
      </div>
    </div>

    <div v-if="dueSoon.length" class="card" style="margin-top:12px;padding:12px 14px">
      <div v-for="d in dueSoon" :key="d.key" class="row small" style="padding:3px 0">
        <span class="ms" style="font-size:18px;color:var(--warn)">event</span>
        <span class="grow ell">{{ d.label }}</span>
        <span class="muted">{{ d.when }}</span>
      </div>
    </div>

    <div v-if="!monthDays.length" class="card empty" style="margin-top:14px">
      <span class="ms">receipt_long</span>ยังไม่มีรายการเดือนนี้<br><span class="small">กด + เพื่อจด หรือปิดแอปธนาคารหลังโอน ระบบจะอ่านสลิปให้เอง</span>
    </div>
    <div v-for="g in monthDays" :key="g.key" class="day">
      <div class="dayhead">
        <span><b>{{ g.dayNum }}</b> {{ g.label }}</span>
        <span class="num"><span v-if="g.inc" class="inc">+{{ money(g.inc) }}</span><span v-if="g.inc && g.exp"> · </span><span v-if="g.exp">-{{ money(g.exp) }}</span></span>
      </div>
      <div class="card" style="padding:4px 12px">
        <button v-for="t in g.items" :key="t.id" class="txrow" @click="openTx(t)">
          <div class="dot" :style="{background: txColor(t)}"><span class="ms">{{ txIcon(t) }}</span></div>
          <div class="grow">
            <div class="ell b" style="font-weight:400">{{ txTitle(t) }}</div>
            <div class="row small muted" style="gap:6px;margin-top:2px">
              <span class="ell">{{ txSub(t) }}</span>
              <span v-if="t.source==='slip' || t.source==='sms'" class="chip slip"><span class="ms" style="font-size:13px">bolt</span>{{ t.source==='sms' ? 'SMS' : 'สลิป' }}</span>
              <span v-if="!t.account_id && t.kind!=='income'" class="chip warn">เลือกบัญชี</span>
            </div>
          </div>
          <div class="amt num" :class="t.kind==='income' ? 'inc' : t.kind==='expense' ? 'exp' : 'muted'">{{ t.kind==='income' ? '+' : t.kind==='expense' ? '-' : '' }}{{ money(t.amount) }}</div>
        </button>
      </div>
    </div>
  </template>

  <!-- ───────── report ───────── -->
  <template v-if="tab==='report'">
    <div class="top">
      <h1>สรุป</h1>
      <div class="month">
        <button @click="shiftMonth(-1)"><span class="ms">chevron_left</span></button>
        <b>{{ monthLabel }}</b>
        <button @click="shiftMonth(1)"><span class="ms">chevron_right</span></button>
      </div>
    </div>
    <div class="seg"><button :class="{on:reportKind==='expense'}" @click="reportKind='expense'">รายจ่าย</button><button :class="{on:reportKind==='income'}" @click="reportKind='income'">รายรับ</button></div>
    <div class="card" style="margin-top:12px">
      <div class="row" style="gap:16px">
        <svg viewBox="0 0 120 120" width="138" height="138" style="flex:none">

/* Wallet Story export (transaction_all_*.csv) */
function parseCsv(text){
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++ } else q = false } else f += c }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = '' }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = '' }
    else f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row) }
  const head = rows.shift() || [];
  return rows.filter(r=>r.length > 2).map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(), (r[i]||'').trim()])));
}
const norm = s => String(s||'').toLowerCase().replace(/[\s()\-_.]/g, '');
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return (h>>>0).toString(36) };

  methods:{

    sum(list){ return list.reduce((s,t)=>s + +t.amount, 0) },
    money(n, sign){ n = +n || 0; const neg = n<0; const s = Math.abs(n).toLocaleString('th-TH',{ minimumFractionDigits: Math.abs(n)%1 ? 2 : 0, maximumFractionDigits:2 });

    moneyShort(n){ return n>=1e6 ? '฿'+(n/1e6).toFixed(1)+'M' : n>=1e4 ? '฿'+(n/1e3).toFixed(1)+'k' : this.money(Math.round(n)) },
    isToday(d){ return d.toDateString() === new Date().toDateString() },
    shiftMonth(k){ this.month = new Date(this.month.getFullYear(), this.month.getMonth()+k, 1) },
    nextDue(day){ const t = new Date(); t.setHours(0,0,0,0); let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, 28 + (day>28 ? 0 : 0)));
      d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate()));
      if (d < t) d = new Date(t.getFullYear(), t.getMonth()+1, Math.min(day, new Date(t.getFullYear(), t.getMonth()+2, 0).getDate()));
      return d },
    nextDate(day){ return this.nextDue(day).toLocaleDateString('th-TH',{ day:'numeric', month:'short' }) },
    shade(hex){ const n = parseInt(hex.slice(1),16); const f = c => Math.max(0, Math.round(c*0.84));
      return '#' + [f(n>>16), f((n>>8)&255), f(n&255)].map(x=>x.toString(16).padStart(2,'0')).join('') },
    last4(a){ const n = this.acctNo(a); if (n) { const d = n.replace(/\D/g,''); return d.length>=10 && d.length<=12 ? d.slice(-5,-1) : d.slice(-4) } const g = this.digitsOf(a); return g ? String(g).trim().slice(-4) : '' },
    digitsOf(a){ return (a.match||[]).find(m=>/^\d{3,}$/.test(String(m).trim())) },
    /* the full account number is kept in the match list as "no:<digits>"; its last 4 digits are what slips show */
    acctNo(a){ const m = (a.match||[]).find(x=>String(x).startsWith('no:')); return m ? m.slice(3) : '' },
    /* Thai slips hide most of the number: "xxx-x-x5678-x" shows digits 6–9, some banks show the last 4 */
    slipDigits(no){ const d = String(no||'').replace(/\D/g,''); if (d.length < 4) return []; return [...new Set(d.length >= 10 ? [d.slice(-5,-1), d.slice(-4)] : [d.slice(-4)])] },
    lastDigits(no){ return this.slipDigits(no).join(' หรือ ') },
    maskNo(no){ const d = String(no).replace(/\D/g,''); return d.length >= 10 && d.length <= 12 ? 'xxx-x-x' + d.slice(-5,-1) + '-' + d.slice(-1) : '•••• ' + d.slice(-4) },
    toLocalInput(iso){ const d = new Date(iso); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16) },

    /* ── balances ── */
    balance(a){ let b = +a.opening || 0;
      for (const t of this.allTx){
        if (t.account_id===a.id){ if (t.kind==='income') b += +t.amount; else b -= +t.amount }
        if (t.kind==='transfer' && t.to_account_id===a.id) b += +t.amount;
      } return b },
    /* card limit in use: what is owed now plus instalments not yet billed */
    cardUsed(a){ return Math.max(0, -this.balance(a)) + this.plansOf(a).reduce((s,p)=>s+p.left,0) },
    cutDate(day, y, m){ const dim = new Date(y, m+1, 0).getDate(); return new Date(y, m, Math.min(day||dim, dim), 23, 59, 59) },
    lastCut(card){ const n = new Date(); let c = this.cutDate(card.statement_day, n.getFullYear(), n.getMonth()); if (c > n) c = this.cutDate(card.statement_day, n.getFullYear(), n.getMonth()-1); return c },
    firstCut(card, when){ const d = new Date(when); let c = this.cutDate(card.statement_day, d.getFullYear(), d.getMonth()); if (c < d) c = this.cutDate(card.statement_day, d.getFullYear(), d.getMonth()+1); return c },
    planMonthly(amount, months, rate){ if (!months) return 0; return Math.round((amount/months + amount*(+rate||0)/100)*100)/100 },
    /* instalments and subscriptions on a card: saved once, charged once per statement */
    isPlan(t){ return t.kind==='expense' && (t.installment_months>0 || t.recurring) && this.accById[t.account_id]?.kind==='credit' },
    planCharges(t, upto){
      const card = this.accById[t.account_id], out = [], first = this.firstCut(card, t.occurred_at);
      const inst = t.installment_months>0, N = inst ? +t.installment_months : 600;
      const monthly = inst ? this.planMonthly(+t.amount, N, t.installment_rate) : +t.amount, end = t.ended_at ? new Date(t.ended_at) : null;
      for (let k = 0; k < N; k++){
        const d = this.cutDate(card.statement_day, first.getFullYear(), first.getMonth()+k);
        if (d > upto || (end && d > end)) break;
        out.push({ ...t, id: t.id+'#'+(k+1), parent: t.id, virtual: true, occurred_at: d.toISOString(), amount: monthly,
          payee: (t.payee || '') + (inst ? ' (' + (k+1) + '/' + N + ')' : ''), installment_months: null, recurring: false, planKind: inst ? 'install' : 'monthly' });
      } return out },
    plansOf(card){ const last = this.lastCut(card), prev = this.cutDate(card.statement_day, last.getFullYear(), last.getMonth()-1);
      return this.tx.filter(t=>t.account_id===card.id && this.isPlan(t)).map(t=>{
        const charges = this.planCharges(t, last), inst = t.installment_months>0, months = inst ? +t.installment_months : null;
        const monthly = inst ? this.planMonthly(+t.amount, months, t.installment_rate) : +t.amount, billed = charges.length;
        const lastCharge = charges[charges.length-1];
        return { t, inst, months, monthly, rate:+t.installment_rate||0, billed, ended: !!t.ended_at,
          left: inst ? Math.round(monthly*(months-billed)*100)/100 : 0, inThisBill: !!lastCharge && new Date(lastCharge.occurred_at) > prev };
      }).sort((a,b)=>(a.inst===b.inst ? 0 : a.inst ? -1 : 1) || b.monthly-a.monthly) },
    cardCycle(card){
      const last = this.lastCut(card), prev = this.cutDate(card.statement_day, last.getFullYear(), last.getMonth()-1);
      let spend = 0, inst = 0, paid = 0, unbilled = 0, plansBilled = 0;
      for (const t of this.allTx){ const w = new Date(t.occurred_at);
        if (t.account_id===card.id && t.kind==='expense'){
          if (w>prev && w<=last){ if (t.virtual){ inst += +t.amount; plansBilled++ } else spend += +t.amount }
          else if (w>last && !t.virtual) unbilled += +t.amount;
        }
        if (t.to_account_id===card.id && t.kind==='transfer' && w>last) paid += +t.amount;
      }
      const bill = spend + inst, due = Math.max(0, Math.round((bill - paid)*100)/100);
      const f = d => d.toLocaleDateString('th-TH',{ day:'numeric', month:'short' });
      const dim = (y,m) => new Date(y, m+1, 0).getDate();
      let dd = new Date(last.getFullYear(), last.getMonth(), Math.min(card.due_day||1, dim(last.getFullYear(), last.getMonth())));
      if (dd <= last) dd = new Date(last.getFullYear(), last.getMonth()+1, Math.min(card.due_day||1, dim(last.getFullYear(), last.getMonth()+1)));
      const today = new Date(); today.setHours(0,0,0,0);
      return { spend, inst, paid, unbilled, due, bill, plansBilled, dueDate: dd, overdue: due>0 && dd < today, dueText: card.due_day ? f(dd) : '-',
        min: Math.min(due, Math.ceil(bill*0.08)), range: f(new Date(prev.getTime()+1000)) + ' – ' + f(last) };
    },
    shortDate(iso){ return new Date(iso).toLocaleDateString('th-TH',{ day:'numeric', month:'short' }) },
    debtPaid(d){ return this.sum(this.tx.filter(t=>t.debt_id===d.id)) },
    debtLeft(d){ return Math.max(0, (+d.principal||0) - this.debtPaid(d)) },
    debtPct(d){ return d.principal ? Math.min(100, this.debtPaid(d)/d.principal*100) : 0 },
    paidThisCycle(d){ const since = Date.now() - 25*864e5; return this.tx.some(t=>t.debt_id===d.id && new Date(t.occurred_at).getTime() > since) },
    categoriesOf(kind){ return this.categories.filter(c=>c.kind===kind && !c.archived).sort((a,b)=>(a.sort||0)-(b.sort||0)) },
    txTitle(t){ if (t.kind==='transfer'){ const a=this.accById[t.account_id], b=this.accById[t.to_account_id]; return (b && b.kind==='credit' ? 'จ่ายบัตร ' : 'โอน ') + (a?a.name:'?') + ' → ' + (b?b.name:'?') }
      return this.catById[t.category_id]?.name || 'ไม่มีหมวด' },
    txSub(t){ return [t.payee || t.note, t.kind!=='transfer' && this.accById[t.account_id]?.name, t.installment_months ? 'ผ่อน ' + t.installment_months + ' เดือน' : '', new Date(t.occurred_at).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})].filter(Boolean).join(' · ') },
    txColor(t){ return t.kind==='transfer' ? '#9aa5b1' : (this.catById[t.category_id]?.color || '#b8b0a2') },
    txIcon(t){ if (t.kind==='transfer') return this.accById[t.to_account_id]?.kind==='credit' ? 'credit_score' : 'swap_horiz'; return this.catById[t.category_id]?.icon || 'help' },

    /* ── data: Supabase or this device ── */
    async signIn(){
      this.busy = true; this.login.error = '';
      const { data, error } = await sb.auth.signInWithPassword({ email: this.login.email.trim(), password: this.login.password });
      this.busy = false;
      if (error){ this.login.error = 'เข้าไม่ได้: ' + (error.message.includes('Invalid') ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : error.message); return }
      await this.enterCloud(data.session);
    },
    async enterCloud(session){
      this.mode = 'cloud'; this.userEmail = session.user.email; safe.del('coinote-mode');
      await sb.rpc('cn_bootstrap');
      await this.loadCloud();
      sb.channel('coinote').on('postgres_changes', { event:'*', schema:'public' }, p => this.applyChange(p)).subscribe();
    },
    async loadAll(table){
      const out = []; for (let from = 0; ; from += 1000){
        const { data, error } = await sb.from(table).select('*').range(from, from+999);
        if (error){ this.say('โหลดข้อมูลไม่ได้: ' + error.message); break }
        out.push(...data); if (data.length < 1000) break;
      } return out },
    async loadCloud(){
      const [accounts, categories, debts, tx, rules] = await Promise.all(TABLES.map(t=>this.loadAll(t)));
      Object.assign(this, { accounts, categories, debts, tx, rules });
      const { data } = await sb.from('cn_settings').select('*').maybeSingle();
      if (data){ this.settings = data; this.myNamesText = (data.my_names||[]).join(', ') }
    },
    applyChange(p){
      const key = { cn_accounts:'accounts', cn_categories:'categories', cn_debts:'debts', cn_tx:'tx' }[p.table]; if (!key) return;
      const list = this[key].filter(r=>r.id !== (p.old?.id || p.new?.id));
      if (p.eventType !== 'DELETE') list.push(p.new);
      this[key] = list;
      if (p.table==='cn_tx' && p.eventType==='INSERT' && p.new.source!=='manual') this.say('รับสลิปใหม่: ' + this.money(p.new.amount) + (p.new.payee ? ' · ' + p.new.payee : ''));
    },
    startDemo(){
      let d = null; try { d = JSON.parse(safe.get(DEMO_KEY)) } catch(e){}
      if (!d) d = demoData();
      Object.assign(this, { accounts:d.accounts, categories:d.categories, debts:d.debts, tx:d.tx, rules:d.rules||[], settings:d.settings||{} });
      this.myNamesText = (this.settings.my_names||[]).join(', ');
      this.mode = 'demo'; safe.set('coinote-mode','demo'); this.persistDemo();
    },
    persistDemo(){ if (this.mode==='demo') safe.set(DEMO_KEY, JSON.stringify({ accounts:this.accounts, categories:this.categories, debts:this.debts, tx:this.tx, rules:this.rules, settings:this.settings })) },
    async resetDemo(){ if (!(await this.ask('ล้างข้อมูลในเบราว์เซอร์นี้ แล้วกลับไปใช้ข้อมูลตัวอย่าง?'))) return; safe.del(DEMO_KEY); this.startDemo(); this.say('กลับไปใช้ข้อมูลตัวอย่างแล้ว') },
    async upsert(table, row){
      const key = { cn_accounts:'accounts', cn_categories:'categories', cn_debts:'debts', cn_tx:'tx' }[table];
      if (this.mode==='cloud'){
        const { data, error } = await sb.from(table).upsert(row).select().single();
        if (error){ this.say('บันทึกไม่ได้: ' + error.message); return null }
        row = data;
      } else if (!row.id) row = { ...row, id: uid() };
      this[key] = [...this[key].filter(r=>r.id!==row.id), row];
      this.persistDemo(); return row;
    },
    async deleteRow(table, id){
      if (!(await this.ask('ลบรายการนี้?'))) return;
      if (this.mode==='cloud'){ const { error } = await sb.from(table).delete().eq('id', id); if (error){ this.say(error.message); return } }
      this.tx = this.tx.filter(r=>r.id!==id); this.persistDemo(); this.sheet = null; this.say('ลบแล้ว');
    },
    async signOut(){ if (this.mode==='cloud') await sb.auth.signOut(); safe.del('coinote-mode'); this.mode = null; this.tab = 'home' },

    /* ── add or edit a transaction ── */
    newTx(preset={}){
      const kind = preset.kind || 'expense';
      const ck = kind==='income' ? 'income' : 'expense';
      this.draft = { id:null, kind, cardMode:'spend', planType:'full', recurring:false, ended_at:null, card_id: this.card?.id || null, category_id: this.categoriesOf(ck)[0]?.id || null, account_id: this.cashAccounts[0]?.id || null,
        to_account_id: kind==='transfer' ? (this.cashAccounts[1]?.id || null) : null, installment_months:null, installment_rate:0, payOpt:'due',
        debt_id:null, payee:'', when: this.toLocalInput(new Date().toISOString()), ...preset };
      this.expr = preset.amount ? String(preset.amount) : ''; this.showRaw = false; this.sheet = { type:'tx' };
    },
    newCardTx(mode){ this.newTx({ kind:'card', cardMode:mode, card_id: this.card?.id || this.cards[0]?.id || null }); if (mode==='pay') this.payOption('due') },
    setCardMode(m){ this.draft.cardMode = m; if (m==='pay') this.payOption(this.draft.payOpt || 'due') },
    payOption(o){ this.draft.payOpt = o; const c = this.draftCard; if (!c || o==='custom') return;
      const v = o==='due' ? this.cardCycle(c).due : o==='min' ? this.cardCycle(c).min : this.cardUsed(c); this.expr = v ? String(Math.round(v*100)/100) : '' },
    pickFrom(id){ this.draft.account_id = id; if (this.draft.to_account_id===id) this.draft.to_account_id = this.cashAccounts.find(a=>a.id!==id)?.id || null },
    async endPlan(){ if (!(await this.ask('ยกเลิกสมาชิกนี้? รอบบิลถัดไปจะไม่ถูกลงค่าใช้จ่ายอีก'))) return;
      const { originalCategory, cardMode, payOpt, planType, card_id, when, ...row } = this.draft;
      await this.upsert('cn_tx', { ...row, ended_at: new Date().toISOString() }); this.sheet = null; this.say('ยกเลิกสมาชิกแล้ว') },
    pickPlan(k){ this.draft.planType = k; if (k==='install' && !this.draft.installment_months) this.draft.installment_months = 10 },
    swapAccounts(){ const a = this.draft.account_id; this.draft.account_id = this.draft.to_account_id; this.draft.to_account_id = a },
    openTx(t){ if (t.virtual) t = this.tx.find(x=>x.id===t.parent) || t;
      const acc = this.accById[t.account_id], to = this.accById[t.to_account_id];
      this.draft = { ...t, planType: t.installment_months>0 ? 'install' : t.recurring ? 'monthly' : 'full', payee: t.payee || t.note || '', when: this.toLocalInput(t.occurred_at), originalCategory: t.category_id, cardMode:'spend', payOpt:'custom', installment_rate: t.installment_rate || 0 };
      if (t.kind==='expense' && acc?.kind==='credit') Object.assign(this.draft, { kind:'card', cardMode:'spend', card_id: acc.id });
      if (t.kind==='transfer' && to?.kind==='credit') Object.assign(this.draft, { kind:'card', cardMode:'pay', card_id: to.id });
      this.expr = String(+t.amount); this.showRaw = false; this.sheet = { type:'tx' } },
    setKind(k){ this.draft.kind = k; const ck = k==='income' ? 'income' : 'expense';
      if (k!=='transfer' && this.draftCat?.kind !== ck) this.draft.category_id = this.categoriesOf(ck)[0]?.id || null;
      if (k==='card' && !this.draft.card_id) this.draft.card_id = this.card?.id || this.cards[0]?.id || null;
      if (k==='transfer' && (!this.draft.to_account_id || this.draft.to_account_id===this.draft.account_id)) this.draft.to_account_id = this.cashAccounts.find(a=>a.id!==this.draft.account_id)?.id || null;
      if (k!=='card' && this.accById[this.draft.account_id]?.kind==='credit') this.draft.account_id = this.cashAccounts[0]?.id || null },
    press(k){
      let e = this.expr;
      if (k==='back') e = e.slice(0,-1);
      else if (k==='+' || k==='−'){ if (e && !/[+−]$/.test(e)) e += k }
      else if (k==='.'){ const last = e.split(/[+−]/).pop(); if (!last.includes('.')) e += (last ? '' : '0') + '.' }
      else { const last = e.split(/[+−]/).pop(); if (!(last.includes('.') && last.split('.')[1].length>=2) && e.length<14) e = (e==='0' ? '' : e) + k }
      this.expr = e;
    },
    evalExpr(){ let total = 0, sign = 1;
      for (const part of this.expr.split(/([+−])/)){ if (part==='+') sign = 1; else if (part==='−') sign = -1; else if (part) total += sign * parseFloat(part) }
      return Math.round(total*100)/100 },
    async saveTx(){
      const amount = this.evalExpr(), d = this.draft;
      if (!(amount>0)){ this.say('ใส่จำนวนเงินก่อน'); return }
      if (d.kind==='transfer' && (!d.to_account_id || d.to_account_id===d.account_id)){ this.say('เลือกบัญชีปลายทาง'); return }
      if (d.kind==='card' && !d.card_id){ this.say('เลือกบัตรก่อน'); return }
      const spend = d.kind==='card' && d.cardMode==='spend', pay = d.kind==='card' && d.cardMode==='pay';
      const kind = spend ? 'expense' : pay ? 'transfer' : d.kind;
      const row = { amount, kind, category_id: kind==='transfer' ? null : d.category_id,
        account_id: spend ? d.card_id : d.account_id,
        to_account_id: pay ? d.card_id : (kind==='transfer' ? d.to_account_id : null),
        debt_id: d.kind==='expense' ? (d.debt_id||null) : null,
        installment_months: spend && d.planType==='install' ? d.installment_months : null,
        installment_rate: spend && d.planType==='install' ? (+d.installment_rate||0) : null,
        recurring: spend && d.planType==='monthly', ended_at: spend && d.planType==='monthly' ? (d.ended_at||null) : null,
        payee: (d.payee||'').trim() || (pay ? 'ชำระบัตร' : null), occurred_at: new Date(d.when).toISOString() };
      if (d.id) Object.assign(row, { id:d.id, source:d.source, ref:d.ref, raw:d.raw, note:d.note });
      if (!d.id) row.source = 'manual';
      const saved = await this.upsert('cn_tx', row); if (!saved) return;
      // learn: a slip whose category you changed teaches the payee → category rule
      if (d.id && d.source!=='manual' && row.payee && row.category_id && row.category_id !== d.originalCategory) await this.learnRule(row.payee, row.category_id);
      this.sheet = null; this.say('บันทึกแล้ว');
    },
    async learnRule(payee, category_id){
      const pattern = payee.replace(/สาขา.*$/,'').replace(/\s+\d+$/,'').replace(/\s+[ก-๙A-Za-z]\.?$/,'').trim();
      if (pattern.length < 2) return;
      if (this.mode==='cloud'){ const { error } = await sb.from('cn_rules').upsert({ pattern, category_id }); if (error) return }
      this.rules = [...this.rules.filter(r=>r.pattern!==pattern), { pattern, category_id }]; this.persistDemo();
      setTimeout(()=>this.say('จำแล้ว: ครั้งหน้า "' + pattern + '" จะเป็น ' + this.catById[category_id].name), 900);
    },

    /* ── wallet items ── */
    newWalletItem(){ if (this.walletTab==='debt') this.editDebt(null); else this.editAccount(null) },
    editAccount(a){
      const base = a && a.id ? { ...a } : { name:'', kind:(a&&a.kind)||'bank', opening:0, color:'#5aa9e6', icon:(a&&a.kind)==='credit' ? 'credit_card' : 'account_balance', match:[] };
      const now = base.id ? this.balance(base) : (+base.opening||0);
      base.openingInput = Math.round((base.kind==='credit' ? -now : now)*100)/100;
      base.acctNoInput = this.acctNo(base);
      const auto = this.slipDigits(base.acctNoInput);
      base.matchText = (base.match||[]).filter(m=>!String(m).startsWith('no:') && !auto.includes(m)).join(', ');
      this.draft = base; this.sheet = { type:'account' };
    },
    async saveAccount(){
      const d = this.draft; if (!d.name.trim()){ this.say('ตั้งชื่อก่อน'); return }
      const row = { name:d.name.trim(), kind:d.kind, color:d.color, icon:d.icon,
        opening: (d.kind==='credit' ? -(+d.openingInput||0) : (+d.openingInput||0)) - (d.id ? this.balance(d) - (+d.opening||0) : 0),
        credit_limit: d.kind==='credit' ? (+d.credit_limit||null) : null, statement_day: d.kind==='credit' ? (d.statement_day||null) : null, due_day: d.kind==='credit' ? (d.due_day||null) : null,
        match: (()=>{ const no = String(d.acctNoInput||'').replace(/\D/g,''), auto = this.slipDigits(no);
          const terms = d.matchText.split(',').map(s=>s.trim()).filter(t=>t && !auto.includes(t));
          return [...(no ? ['no:' + no] : []), ...auto, ...terms] })(), sort: d.sort ?? this.accounts.length+1, archived:false };
      if (d.id) row.id = d.id;
      const saved = await this.upsert('cn_accounts', row);
      if (saved){ const back = this.stash; if (back && saved.id && saved.kind!=='credit'){ back.draft[back.field] = saved.id }
        this.sheet = null; this.say('บันทึกแล้ว'); if (saved.kind==='credit' && !back){ this.cardId = saved.id; this.tab = 'cards' } }
    },
    async archiveAccount(){ if (!(await this.ask('ซ่อนบัญชีนี้? รายการเก่ายังอยู่ครบ'))) return;
      const { openingInput, matchText, acctNoInput, ...row } = this.draft; await this.upsert('cn_accounts', { ...row, archived:true }); this.sheet = null },
    editDebt(d){ this.draft = d ? { ...d } : { name:'', lender:'', principal:null, monthly:null, due_day:null, interest:null, note:'', closed:false }; this.sheet = { type:'debt' } },
    async saveDebt(){ const d = this.draft; if (!d.name.trim()){ this.say('ตั้งชื่อก่อน'); return }
      const row = { name:d.name.trim(), lender:d.lender||null, principal:+d.principal||0, monthly:+d.monthly||null, due_day:d.due_day||null, interest:d.interest??null, note:d.note||null, closed:false };
      if (d.id) row.id = d.id; if (await this.upsert('cn_debts', row)){ this.sheet = null; this.say('บันทึกแล้ว') } },
    async closeDebt(){ if (!(await this.ask('ปิดหนี้นี้ (จ่ายครบแล้ว)?'))) return; await this.upsert('cn_debts', { ...this.draft, closed:true }); this.sheet = null; this.say('ยินดีด้วย ปิดหนี้แล้ว') },
    payDebt(d){ const c = this.categories.find(c=>c.name==='ผ่อนหนี้' && c.kind==='expense');
      this.newTx({ kind:'expense', category_id: c?.id || null, debt_id: d.id, payee: d.lender || d.name, amount: d.monthly || '' }) },
    addFromTx(type, field){ this.stash = { draft:this.draft, expr:this.expr, field: field || 'account_id' };
      if (type==='category'){ this.editCategory(null); this.draft.kind = this.stash.draft.kind==='income' ? 'income' : 'expense' } else this.editAccount({ kind:'bank' }) },
    editCategory(c){ this.draft = c ? { ...c, keywordsText:(c.keywords||[]).join(', ') } : { name:'', kind:this.catKind, icon:'category', color:'#f28b66', keywordsText:'' }; this.sheet = { type:'category' } },
    async saveCategory(){ const d = this.draft; if (!d.name.trim()){ this.say('ตั้งชื่อก่อน'); return }
      const row = { name:d.name.trim(), kind:d.kind, icon:d.icon, color:d.color, keywords:d.keywordsText.split(',').map(s=>s.trim()).filter(Boolean), sort: d.sort ?? this.categories.length+1, archived:false };
      if (d.id) row.id = d.id; const saved = await this.upsert('cn_categories', row);
      if (saved){ if (this.stash && saved.id && saved.kind === (this.stash.draft.kind==='income' ? 'income' : 'expense')) this.stash.draft.category_id = saved.id; this.sheet = null; this.say('บันทึกแล้ว') } },
    async archiveCategory(){ if (!(await this.ask('ลบหมวดหมู่นี้? รายการเก่ายังอยู่'))) return; const { keywordsText, ...row } = this.draft; await this.upsert('cn_categories', { ...row, archived:true }); this.sheet = null },

    /* ── settings ── */
    async saveMyNames(){ const names = this.myNamesText.split(',').map(s=>s.trim()).filter(Boolean);
      if (this.mode==='cloud'){ const { error } = await sb.from('cn_settings').update({ my_names:names }).eq('user_id', this.settings.user_id); if (error){ this.say(error.message); return } }
      this.settings = { ...this.settings, my_names:names }; this.persistDemo(); this.say('บันทึกชื่อแล้ว') },
    async newToken(){ if (!(await this.ask('สร้างรหัสใหม่? Shortcut เดิมจะใช้ไม่ได้จนกว่าจะใส่รหัสใหม่'))) return;
      const { data, error } = await sb.rpc('cn_new_token'); if (error){ this.say(error.message); return }
      this.settings = { ...this.settings, token: data }; this.showToken = true; this.say('สร้างรหัสใหม่แล้ว อย่าลืมแก้ใน Shortcut') },
    async testSlip(dry){ if (!this.testText.trim()) return;
      const { data, error } = await sb.rpc('cn_ingest_slip', { p_token:this.settings.token, p_text:this.testText, p_dry:dry });
      this.testResult = error ? 'ผิดพลาด: ' + error.message : data.message; if (!dry && data?.ok && !data.duplicate) await this.loadCloud() },
    setTheme(v){ this.theme = v; safe.set('coinote-theme', v) },
    copy(text){ if (!text) return; navigator.clipboard?.writeText(text).then(()=>this.say('คัดลอกแล้ว'), ()=>this.say('คัดลอกไม่ได้ กดค้างที่ข้อความแทน')) },
    async importWalletStory(ev){
      const file = ev.target.files[0]; ev.target.value = ''; if (!file) return;
      let rows; try { rows = parseCsv(await file.text()) } catch(e){ rows = [] }
      if (!rows.length || !('CATEGORY' in rows[0]) || !('AMOUNT' in rows[0])){ this.say('ไฟล์นี้ไม่ใช่ CSV ที่ส่งออกจาก Wallet Story'); return }
      if (this.mode==='demo' && !this.settings.imported){
        if (!(await this.ask('พบ ' + rows.length + ' รายการ ล้างข้อมูลตัวอย่างแล้วใส่ข้อมูลจากไฟล์แทน? ข้อมูลจะอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น'))) return;
        const st = starterData(); Object.assign(this, { accounts:st.accounts, categories:st.categories, debts:[], tx:[], rules:[], settings:{ ...st.settings, imported:true } });
      } else if (!(await this.ask('นำเข้า ' + rows.length + ' รายการจาก Wallet Story?'))) return;
      this.importing = true;
      try {
        const accBy = new Map(this.accounts.map(a=>[norm(a.name), a])), catBy = new Map(this.categories.map(c=>[c.kind + ':' + norm(c.name), c]));
        const getAcc = async (name, credit) => { if (!name) return null; let a = accBy.get(norm(name));
          if (!a){ a = await this.upsert('cn_accounts', { name, kind: credit ? 'credit' : /money|wallet|เป๋า|pay/i.test(name) ? 'ewallet' : 'bank', icon: credit ? 'credit_card' : 'account_balance', color:'#9aa5b1', match:[], opening:0, sort:this.accounts.length+1, archived:false }); accBy.set(norm(name), a) }
          return a };
        const getCat = async (name, kind) => { let c = catBy.get(kind + ':' + norm(name));
          if (!c){ c = await this.upsert('cn_categories', { name, kind, icon:'category', color:'#b8b0a2', keywords:[], sort:this.categories.length+1, archived:false }); catBy.set(kind + ':' + norm(name), c) }
          return c };
        const have = new Set(this.tx.map(t=>t.ref).filter(Boolean)), out = []; let skipped = 0;
        for (const r of rows){
          const amt = parseFloat(r['AMOUNT (THB)'] || r.AMOUNT); if (!amt || !r.DATE) continue;
          const ref = 'ws:' + r.DATE.replace(/\D/g,'') + ':' + hash(Object.values(r).join('|'));
          if (have.has(ref)){ skipped++; continue } have.add(ref);
          const kind = amt < 0 ? 'expense' : 'income';
          if (r.CREDIT_CARD) await getAcc(r.CREDIT_CARD, true);
          const a = await getAcc(r.BANK_ACCOUNT || r.CREDIT_CARD, !r.BANK_ACCOUNT), c = await getCat(r.CATEGORY || 'อื่นๆ', kind);
          const inParens = (r.NOTE.match(/^\((.*?)\)/) || [])[1];
          out.push({ id: uid(), occurred_at: new Date(r.DATE.replace(' ', 'T') + '+07:00').toISOString(), amount: Math.abs(amt), kind,
            category_id: c?.id || null, account_id: a?.id || null, to_account_id:null, debt_id:null,
            payee: r.DEBT || r.SUB_CATEGORY || inParens || r.NOTE || null,
            note: [r.NOTE, r.CREDIT_CARD && ('บัตร ' + r.CREDIT_CARD)].filter(Boolean).join(' · ') || null, source:'import', ref });
        }
        if (this.mode==='cloud'){
          for (let i = 0; i < out.length; i += 500){
            const { data, error } = await sb.from('cn_tx').insert(out.slice(i, i+500).map(({ id, ...x })=>x)).select();
            if (error) throw error; this.tx = this.tx.concat(data);
          }
        } else { this.tx = this.tx.concat(out); this.persistDemo() }
        const last = out.map(t=>t.occurred_at).sort().pop();
        if (last){ const d = new Date(last); this.month = new Date(d.getFullYear(), d.getMonth(), 1) }
        this.tab = 'home'; this.say('นำเข้าแล้ว ' + out.length + ' รายการ' + (skipped ? ' (ข้ามที่ซ้ำ ' + skipped + ')' : ''));
      } catch(e){ this.say('นำเข้าไม่สำเร็จ: ' + (e.message || e)) }
      finally { this.importing = false }
    },
    ask(msg){ return new Promise(res=>{ this.asking = { msg, res } }) },
    answer(v){ const a = this.asking; this.asking = null; a && a.res(v) },
    say(msg){ this.toast = msg; clearTimeout(this.toastTimer); this.toastTimer = setTimeout(()=>this.toast='', 2600) },
    exportCsv(){
      const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
      const rows = [['วันที่','ประเภท','หมวดหมู่','บัญชี','ไปบัญชี','จำนวน','ร้าน/ผู้รับ','ที่มา']]
        .concat([...this.tx].sort((a,b)=>a.occurred_at.localeCompare(b.occurred_at)).map(t=>[new Date(t.occurred_at).toLocaleString('th-TH'), this.kindTx[t.kind], this.catById[t.category_id]?.name,
          this.accById[t.account_id]?.name, this.accById[t.to_account_id]?.name, t.amount, t.payee, t.source]));
      const blob = new Blob(['﻿' + rows.map(r=>r.map(q).join(',')).join('\n')], { type:'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'coinote.csv'; a.click();
    },
  }
}).component('b-drop', {
  props:{ label:String, icon:String, color:String, sub:String, three:Boolean, plain:Boolean, placeholder:String },
  data(){ return { open:false } },
  methods:{ picked(e){ const b = e.target.closest('.opt,[data-pick]'); if (b && !b.disabled) this.open = false } },
  template:`<div class="drop" :class="{open}">
    <button type="button" class="opt dropbtn" :aria-expanded="open" @click="open=!open">
      <span v-if="icon" class="ms" :style="{color: color || 'var(--muted)'}">{{ icon }}</span>
      <span class="grow" style="min-width:0"><span class="ell" style="display:block" :class="{muted:!label}">{{ label || placeholder || 'เลือก' }}</span><span v-if="sub" class="sub num">{{ sub }}</span></span>
      <span class="ms chev">expand_more</span></button>
    <div v-if="open" class="droplist" :class="{opts:!plain, three}" @click="picked"><slot></slot></div></div>`
}).component('b-opt', {
  props:{ on:Boolean, icon:String, color:String, sub:String, disabled:Boolean },
  emits:['pick'],
  template:`<button type="button" class="opt" :class="{on}" :disabled="disabled" :aria-pressed="on" @click="$emit('pick')">
    <span class="bul"></span><span v-if="icon" class="ms" :style="{color: color || 'var(--muted)'}">{{ icon }}</span>
    <span class="grow" style="min-width:0"><span class="ell" style="display:block"><slot></slot></span><span v-if="sub" class="sub num">{{ sub }}</span></span></button>`
}).mount('#app');
</script>
</body>
